# The local stack: Postgres, the metrics store, the collector, our own
# services, and demo services with a load generator so there is always data.
#
# Start it with `make dev` from the repository root. Ports come from .env.

name: app-dev

# Every service in apps/ runs from one image, built from the repository root.
x-app: &app
  build:
    context: ..
    dockerfile: infra/docker/app.Dockerfile
  image: app-dev-services
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 30

  # VictoriaMetrics is the default store. The rest of the code only uses the
  # Prometheus-compatible API on this port, so Prometheus can replace it.
  metrics-store:
    image: victoriametrics/victoria-metrics:v1.156.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
    ports:
      - '${METRICS_STORE_PORT:-8428}:8428'
    volumes:
      - metrics-data:/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8428/health']
      interval: 2s
      timeout: 3s
      retries: 30

  # Private. Stamps the workspace label from the header the ingestion service
  # sets, then forwards to the store. Only its health port is published.
  # The image has no shell, so there is no container health check;
  # `make verify` checks the health endpoint from the host.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      METRICS_STORE_REMOTE_WRITE_URL: http://metrics-store:8428/api/v1/write
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '${COLLECTOR_HEALTH_PORT:-13133}:13133'
    depends_on:
      metrics-store:
        condition: service_healthy

  # The only service that talks to the metrics store.
  query-api:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/query-api/src/main.ts']
    environment:
      PORT: '8080'
      METRICS_STORE_URL: http://metrics-store:8428
      METRICS_STORE_TYPE: ${METRICS_STORE_TYPE:-victoriametrics}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-10000}
      QUERY_MAX_LINES: ${QUERY_MAX_LINES:-50}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-15}
      DATABASE_URL: postgres://app:app@postgres:5432/app
      PLANS_FILE: ${PLANS_FILE:-config/plans.example.yaml}
      SECRETS_KEY: ${SECRETS_KEY}
    ports:
      - '${QUERY_API_PORT:-8090}:8080'
    depends_on:
      metrics-store:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: &app-health
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 2s
      timeout: 3s
      retries: 30

  # The public ingestion endpoint: OTLP over HTTP and manifest registration,
  # both authenticated with the workspace's ingestion key.
  ingest:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/ingest/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      COLLECTOR_URL: http://otel-collector:4318
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Development only: lets collectors check the demo services on this private network.
      COLLECTOR_ALLOW_PRIVATE_NETWORKS: 'true'
    ports:
      - '${INGEST_PORT:-4318}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # The one agent behind Slack, the web tool and Review. The only service that
  # calls a model, and only when someone builds or asks.
  agent:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/agent/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PLANS_FILE: ${PLANS_FILE:-config/plans.example.yaml}
      MODELS_FILE: ${MODELS_FILE:-config/models.example.yaml}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Development only: lets collectors check the demo services on this private network.
      COLLECTOR_ALLOW_PRIVATE_NETWORKS: 'true'
      DEFAULT_DASHBOARD_RANGE: ${DEFAULT_DASHBOARD_RANGE:-6h}
    ports:
      - '${AGENT_PORT:-8091}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # The Slack app. Talks to the fake Slack below in development.
  slack:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/slack/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_API_URL: http://slack-fake:8080/api
      SLACK_AUTHORIZE_URL: ${SLACK_AUTHORIZE_URL}
      SLACK_PUBLIC_URL: ${SLACK_PUBLIC_URL}
      WEB_URL: ${WEB_URL}
      INGEST_URL: ${INGEST_URL}
      SECRETS_KEY: ${SECRETS_KEY}
      AGENT_URL: http://agent:8080
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PLANS_FILE: ${PLANS_FILE:-config/plans.example.yaml}
      DEFAULT_DASHBOARD_RANGE: ${DEFAULT_DASHBOARD_RANGE:-6h}
    ports:
      - '${SLACK_PORT:-8092}:8080'
    depends_on:
      agent:
        condition: service_healthy
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # The alert engine: evaluates approved rules, notifies Slack. Never calls a model.
  alerts:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/alerts/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      SLACK_API_URL: http://slack-fake:8080/api
      SECRETS_KEY: ${SECRETS_KEY}
      ALERT_EVAL_SECONDS: ${ALERT_EVAL_SECONDS:-15}
    depends_on:
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # The web tool.
  web:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/web/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      SECRETS_KEY: ${SECRETS_KEY}
      WEB_URL: ${WEB_URL}
      AGENT_URL: http://agent:8080
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      DEFAULT_DASHBOARD_RANGE: ${DEFAULT_DASHBOARD_RANGE:-6h}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_API_URL: http://slack-fake:8080/api
      SLACK_OPENID_AUTHORIZE_URL: ${SLACK_OPENID_AUTHORIZE_URL}
      # Development only: lets "your own store" and collectors point at this private network.
      COLLECTOR_ALLOW_PRIVATE_NETWORKS: 'true'
      PLANS_FILE: ${PLANS_FILE:-config/plans.example.yaml}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_API_URL: http://stripe-fake:8080
      DELETION_GRACE_SECONDS: ${DELETION_GRACE_SECONDS:-}
      GITHUB_APP_INSTALL_URL: ${GITHUB_APP_INSTALL_URL}
      REVIEW_URL: http://review:8080
    ports:
      - '${WEB_PORT:-8094}:8080'
    depends_on:
      agent:
        condition: service_healthy
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # Review: GitHub webhooks, pull request reviews, reports.
  review:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/review/src/main.ts']
    environment:
      PORT: '8080'
      DATABASE_URL: postgres://app:app@postgres:5432/app
      QUERY_API_URL: http://query-api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      WEB_URL: ${WEB_URL}
      SLACK_API_URL: http://slack-fake:8080/api
      SECRETS_KEY: ${SECRETS_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_API_URL: http://github-fake:8080
      REVIEW_WINDOW: ${REVIEW_WINDOW:-24h}
      REVIEW_DEPLOY_WINDOW: ${REVIEW_DEPLOY_WINDOW:-30m}
    volumes:
      - ../.dev-secrets:/secrets:ro
    ports:
      - '${REVIEW_PORT:-8097}:8080'
    depends_on:
      query-api:
        condition: service_healthy
    healthcheck: *app-health

  # A fake GitHub for development: the App API Review calls, a repository made
  # from the demo services, and endpoints that open pull requests and deploys.
  github-fake:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/review/src/fake/github.ts']
    environment:
      PORT: '8080'
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_WEBHOOK_URL: http://review:8080/github/webhook
      GITHUB_SETUP_URL: ${WEB_URL}/github/setup
      DEMO_ROOT: /demo
    volumes:
      - ../.dev-secrets:/secrets:ro
      # The repository it serves: the demo services, as they are on disk.
      - ./demo:/demo:ro
    ports:
      - '${GITHUB_FAKE_PORT:-8096}:8080'
    healthcheck: *app-health

  # A fake Stripe for development: the API billing calls, and a checkout page
  # that pays at once and sends Stripe's webhooks. Not part of the product.
  stripe-fake:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/web/src/fake/stripe.ts']
    environment:
      PORT: '8080'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_WEBHOOK_URL: http://web:8080/billing/webhook
      FAKE_PUBLIC_URL: ${STRIPE_FAKE_URL}
    ports:
      - '${STRIPE_FAKE_PORT:-8095}:8080'
    healthcheck: *app-health

  # A fake Slack for development: the Web API the app calls, and endpoints
  # that act as people (mention, direct message, click). Not part of the product.
  slack-fake:
    <<: *app
    command: ['node', '--import', 'tsx', 'apps/slack/src/fake/server.ts']
    environment:
      PORT: '8080'
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET}
      SLACK_APP_URL: http://slack:8080
      FAKE_INTERNAL_URL: http://slack-fake:8080
      FAKE_PUBLIC_URL: ${SLACK_FAKE_URL}
    ports:
      - '${SLACK_FAKE_PORT:-8093}:8080'
    healthcheck: *app-health

  # The demo services stand in for customers' services. Each was instrumented
  # by the skill from its baseline in demo/baseline/. They send with the dev
  # workspace's ingestion key, like any customer service would with its own.
  demo-checkout:
    build: ./demo/checkout-node
    environment:
      PORT: '8080'
      INVENTORY_URL: http://demo-inventory:8080
      OTEL_SERVICE_NAME: checkout
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:8080
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${DEV_INGESTION_KEY}
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
    ports:
      - '${DEMO_CHECKOUT_PORT:-8081}:8080'
    depends_on:
      ingest:
        condition: service_healthy
      demo-inventory:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

  demo-inventory:
    build: ./demo/inventory-python
    environment:
      OTEL_SERVICE_NAME: inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ingest:8080
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${DEV_INGESTION_KEY}
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
    ports:
      - '${DEMO_INVENTORY_PORT:-8082}:8080'
    depends_on:
      ingest:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"
      interval: 2s
      timeout: 3s
      retries: 30

  # Steady traffic to both demo services, so there is always data to query.
  demo-loadgen:
    build: ./demo/loadgen
    environment:
      CHECKOUT_URL: http://demo-checkout:8080
      INVENTORY_URL: http://demo-inventory:8080
      REQUESTS_PER_SECOND: '6'
    depends_on:
      demo-checkout:
        condition: service_healthy
      demo-inventory:
        condition: service_healthy

volumes:
  postgres-data:
  metrics-data:
