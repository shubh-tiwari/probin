name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm py:lint
      - run: pnpm check:product-name
      - run: pnpm typecheck
      - run: pnpm py:typecheck
      - run: pnpm test
      - run: pnpm py:test

  stack:
    name: Local stack end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Start the stack
        run: make dev
      - name: Phase acceptance check and integration tests
        run: make verify
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml logs --no-color
      - name: Stop the stack
        if: always()
        run: make reset
