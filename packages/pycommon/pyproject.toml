[project]
name = "app-pycommon"
version = "0.0.0"
description = "Shared helpers for the Python services: the product name, settings, durations and value formatting."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "appcommon"
