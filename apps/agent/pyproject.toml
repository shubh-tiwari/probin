[project]
name = "app-agent"
version = "0.0.0"
description = "The agent: plain-language requests to tested queries, alerts and data sources."
requires-python = ">=3.13"
dependencies = [
  "app-pycommon",
  "app-router",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "pydantic>=2.10",
  "psycopg[binary,pool]>=3.2",
  "pyyaml>=6.0",
]

[project.scripts]
agent = "agent.main:run"
agent-evals = "agent.evals:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[tool.uv.sources]
app-pycommon = { workspace = true }
app-router = { workspace = true }
