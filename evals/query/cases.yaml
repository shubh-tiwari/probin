# The query test set.
#
# Each case is a request a person might type, the answers to give if the agent
# asks a question, and what a correct result looks like. `reference` is a query
# that gives the right answer; the agent's query passes if it returns the same
# data, whatever its text.
#
# The data comes from the demo services (infra/demo), so the stack must be up.
# Run it with `pnpm evals:query`. See evals/README.md for how to read the result
# and how to add a case.
#
# The cases are written the way people write, not the way that is easiest to
# parse. Some are hard on purpose.

# --- Latency: the request-duration histogram ---------------------------------

- id: checkout-latency-example
  request: latency graph of checkout service in last 5 hr
  answers: { endpoint: POST /checkout/pay, percentile: '95' }
  expect:
    outcome: draft
    asks: [endpoint, percentile]
    range: 5h
    type: timeseries
    assumptions: [p95, all requests including failures, all regions combined]
    reference: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="checkout", http_route="/checkout/pay", http_request_method="POST"}[5m])))

- id: checkout-pay-p99
  request: p99 latency of POST /checkout/pay on checkout service in the last 1 hour
  answers: { requests: all }
  expect:
    outcome: draft
    asks: [requests]
    range: 1h
    assumptions: [p99]
    reference: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="checkout", http_route="/checkout/pay", http_request_method="POST"}[5m])))

